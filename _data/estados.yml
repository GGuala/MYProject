# Estados de proyecto — único lugar donde viven sus nombres.
# Para renombrar uno, cambiá "nombre" (y el mismo label en .pages.yml).
# No cambies "clave": es lo que guardan los proyectos.
#
# icono: vacio · mitad · pausa · anillo · lleno
# protegido: true = imágenes con blur y cartel "Contiene spoilers",
#   solo en versión chica, fuera de Google Imágenes y sin vista previa al compartir.

- clave: investigacion
  nombre: En investigación
  icono: vacio
  protegido: true

- clave: produccion
  nombre: En producción
  icono: mitad
  protegido: true

- clave: pausa
  nombre: En pausa
  icono: pausa

- clave: inedito
  nombre: Inédito
  icono: anillo

- clave: exhibido
  nombre: Exhibido
  icono: lleno
