que_hago:
  etiqueta: qUé hago
  items:
  - Hago *arte escultórico* que pregunta dónde vive lo espiritual en el mundo físico.
  - '*Dirijo el lenguaje visual* de marcas y campañas: construyo universos antes que piezas.'
  - 'Trabajo en *instalaciones y experiencias espaciales*, también las técnicamente complejas. Robótica, entornos inmersivos, restricciones de ingeniería: esa es la parte interesante.'
  imagen: /img/home/working.webp
  imagen_alt: Mesa de trabajo con bocetos, planos y cuadernos
  etiqueta_en: wHat I do
  items_en:
  - I make *sculptural art* that asks where the spiritual lives in the physical world.
  - I *direct the visual language* of brands and campaigns — building universes before assets.
  - I work on *installations and spatial experiences*, including technically complex ones. Robotics, immersive environments, engineering constraints — these are the interesting part.
  imagen_alt_en: Work table with sketches, plans and notebooks
sobre_mi:
  etiqueta: sObre mí
  columna_1:
  - 'Mi práctica cruza escultura, fotografía y tecnología alrededor de una sola búsqueda: encontrar la pausa en un mundo con prisa.'
  - 'Busco destellos en lo cotidiano: una luz, un gesto, un silencio que interrumpe el ruido. Esa sensibilidad es el motor de mi obra y la experiencia que busco provocar en quien se encuentra con ella.'
  columna_2:
  - 'Trabajo desde dos gestos: la escultura, que construye e invoca esos momentos, y la fotografía, que los captura y los construye cuando aparecen. En todos los casos busco crear las condiciones para que quien mira se detenga y, con ese segundo de pausa, quizás cambiar el mundo.'
  detalle: Actualmente entre Uruguay y Europa
  etiqueta_en: aBout
  columna_1_en:
  - 'My practice spans sculpture, photography, and technology around a single pursuit: finding the pause in a world in a hurry.'
  - I look for flashes in the ordinary — a light, a gesture, a silence that interrupts the noise. That sensibility is the engine of my work and the experience I seek to provoke in those who encounter it.
  columna_2_en:
  - 'I operate from two gestures: sculpture that builds and invokes those moments, and photography that captures and constructs them when they appear. In every case, I seek to create the conditions for the viewer to stop — and with that second of pause, perhaps change the world.'
  detalle_en: Currently between Uruguay and Europe
