seo:
  titulo: Nicolás Guala — Artista visual | Escultura, fotografía e instalación
  titulo_en: Nicolás Guala — Visual artist | Sculpture, photography and installation
  descripcion: "Nicolás Guala (Montevideo, 1997), artista visual. Escultura,
    fotografía e instalación en torno a una búsqueda: encontrar la pausa en un
    mundo con prisa."
  descripcion_en: "Nicolás Guala (Montevideo, 1997), visual artist. Sculpture,
    photography and installation around a single search: finding the pause in a
    world in a hurry."
hero:
  titular_1: ART that *thinks*
  titular_2: "*art* that FEels."
  rol: Artista y director de arte
  rol_en: Artist & Art Director
  descripcion: Arte escultórico, dirección visual y la convicción de que las
    mejores ideas llegan antes que el brief.
  descripcion_en: Sculptural art, visual direction, and the belief that the best
    ideas arrive before the brief.
  boton: hAblemos
  boton_en: gEt in touch
que_hago:
  etiqueta: qUé hago
  etiqueta_en: wHat I do
  items:
    - Hago *arte escultórico* que pregunta dónde vive lo espiritual en el mundo
      físico.
    - "*Dirijo el lenguaje visual* de marcas y campañas: construyo universos
      antes que piezas."
    - "Trabajo en *instalaciones y experiencias espaciales*, también las
      técnicamente complejas. Robótica, entornos inmersivos, restricciones de
      ingeniería: esa es la parte interesante."
  items_en:
    - I make *sculptural art* that asks where the spiritual lives in the physical
      world.
    - "I *direct the visual language* of brands and campaigns: building universes
      before assets."
    - "I work on *installations and spatial experiences*, including technically
      complex ones. Robotics, immersive environments, engineering constraints:
      these are the interesting part."
  imagen: /img/whatsapp-image-2026-11-16-at-17-32-47.webp
  imagen_alt: Mesa de trabajo con bocetos, planos y cuadernos
  imagen_alt_en: Work table with sketches, plans and notebooks
sobre_mi:
  etiqueta: sObre mí
  etiqueta_en: aBout
  columna_1:
    - "Mi práctica cruza escultura, fotografía y tecnología alrededor de una
      sola búsqueda: encontrar la pausa en un mundo con prisa."
    - "Busco destellos en lo cotidiano: una luz, un gesto, un silencio que
      interrumpe el ruido. Esa sensibilidad es el motor de mi obra y la
      experiencia que busco provocar en quien se encuentra con ella."
  columna_1_en:
    - "My practice spans sculpture, photography, and technology around a single
      pursuit: finding the pause in a world in a hurry."
    - "I look for flashes in the ordinary: a light, a gesture, a silence that
      interrupts the noise. That sensibility is the engine of my work and the
      experience I seek to provoke in those who encounter it."
  columna_2:
    - "Trabajo desde dos gestos: la escultura, que construye e invoca esos
      momentos, y la fotografía, que los captura y los construye cuando
      aparecen. En todos los casos busco crear las condiciones para que quien
      mira se detenga y, con ese segundo de pausa, quizás cambiar el mundo."
  columna_2_en:
    - "I operate from two gestures: sculpture that builds and invokes those
      moments, and photography that captures and constructs them when they
      appear. In every case, I seek to create the conditions for the viewer to
      stop, and with that second of pause, perhaps change the world."
  detalle: Nicolás Guala, artista visual (Montevideo, 1997). Actualmente entre Uruguay y Europa.
  detalle_en: Nicolás Guala, visual artist (Montevideo, 1997). Currently between Uruguay and Europe.
