# Publica heyguala.com en cada cambio de la rama main.
# 1) optimiza las imágenes nuevas de /img (webp, tamaños, sin metadatos)
# 2) guarda esos cambios en el repo
# 3) arma el sitio con Jekyll y lo publica en GitHub Pages
#
# Requiere una sola vez: Settings → Pages → Source: "GitHub Actions".

name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de imagen
        run: pip install pillow pillow-heif

      - name: Optimizar imágenes
        run: python scripts/optimizar_imagenes.py

      - name: Guardar imágenes optimizadas en el repo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Optimizar imágenes"
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Armar el sitio con Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Generar CV en PDF
        run: |
          python3 -m http.server 8000 --directory _site >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            --print-to-pdf=/tmp/nicolas-guala-cv.pdf http://localhost:8000/cv/imprimible/
          sudo cp /tmp/nicolas-guala-cv.pdf _site/cv/nicolas-guala-cv.pdf
          ls -l _site/cv/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
