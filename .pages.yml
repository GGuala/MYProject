# Pages CMS — formulario para editar heyguala.com desde el navegador o el celular.
# Entrá en https://app.pagescms.org con tu cuenta de GitHub y elegí este repo.
# Las fotos se suben a /img; la Action las pasa a webp sola al guardar.

media:
  input: img
  output: /img

content:
  - name: proyectos
    label: Proyectos
    type: collection
    path: _proyectos
    filename: "{primary}.md"
    view:
      primary: titulo
      fields: [titulo, estado, anios]
    fields:
      - name: published
        label: Publicado en la web
        type: boolean
        default: true
        description: "Apagado = el proyecto se guarda pero no aparece en el sitio."
      - name: titulo
        label: Título
        type: string
        required: true
      - name: destacado
        label: Mostrar en la home
        type: boolean
        default: false
      - name: orden
        label: Orden en la home (1 = primero)
        type: number
      - name: imagen_home
        label: Imagen para la home (opcional, puede ser un gif)
        type: image
        description: "Si la dejás vacía, se usa la imagen principal o la primera de la galería."
      - name: estado
        label: Estado
        type: select
        required: true
        description: "Inédito = terminado y disponible, todavía sin exhibir."
        options:
          values:
            - { name: investigacion, label: En investigación }
            - { name: produccion, label: En producción }
            - { name: pausa, label: En pausa }
            - { name: inedito, label: Inédito }
            - { name: exhibido, label: Exhibido }
      - name: anios
        label: Años
        type: string
        description: "Ej.: 2025, o 2026– si sigue abierto"
      - name: medios
        label: Medios
        type: string
        list: true
      - name: hilos
        label: Hilos
        type: select
        options:
          multiple: true
          values: [La pausa, La forma de lo divino, Lo efímero]
      - name: descripcion
        label: Descripción para Google (1–2 frases)
        type: text
      - name: imagen
        label: Imagen principal (opcional)
        type: image
        description: "Podés dejarla vacía o usar una foto de proceso si la obra todavía no se mostró. Sin imagen principal, la portada del proyecto es la primera foto de la galería."
      - name: imagen_alt
        label: Texto alternativo de la imagen principal
        type: string
      - name: imagen_pie
        label: Pie de foto de la imagen principal
        type: string
        description: "Título, año. Técnica. Medidas. Contexto. Foto: nombre."
      - name: body
        label: Texto de obra
        type: rich-text
      - name: ficha
        label: Ficha técnica
        type: object
        fields:
          - { name: tipo, label: Tipo, type: string }
          - { name: tecnica, label: Técnica, type: string }
          - { name: medidas, label: Medidas, type: string }
          - { name: piezas, label: Cantidad de piezas, type: string }
      - name: piezas
        label: Piezas de la serie
        type: object
        list:
          collapsible: true
        fields:
          - { name: titulo, label: Título de la pieza, type: string }
          - { name: formato, label: Formato, type: string }
          - { name: medidas, label: Medidas, type: string }
          - { name: tiras, label: Cantidad de tiras, type: string }
          - name: imagenes
            label: Imágenes (opcional, hasta 4)
            type: object
            list:
              max: 4
            fields:
              - { name: src, label: Imagen, type: image }
              - { name: alt, label: Texto alternativo, type: string }
              - { name: pie, label: Pie de foto, type: string }
      - name: galeria
        label: Galería (opcional)
        description: "Elegí el tipo de cada foto. En investigación o producción podés subir solo proceso, maqueta o investigación."
        type: object
        list:
          collapsible: true
        fields:
          - name: tipo
            label: Tipo
            type: select
            options:
              values: [obra, vista de sala, render, maqueta, proceso, investigación]
          - { name: src, label: Imagen, type: image }
          - { name: alt, label: Texto alternativo, type: string }
          - { name: pie, label: Pie de foto, type: string }
      - name: videos
        label: Videos (YouTube o Vimeo)
        description: "Pegá el link del video. Puede estar como 'no listado' en YouTube o Vimeo."
        type: object
        list:
          collapsible: true
        fields:
          - { name: url, label: Link, type: string, description: "Ej.: https://youtu.be/… o https://vimeo.com/…" }
          - name: tipo
            label: Tipo
            type: select
            options:
              values: [obra, vista de sala, proceso, registro]
          - { name: pie, label: Pie del video, type: string }
      - name: exhibiciones
        label: Exhibiciones y convocatorias
        type: object
        list: true
        fields:
          - { name: anio, label: Año, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: lugar, label: Lugar, type: string }
      - name: creditos
        label: Créditos
        type: object
        list: true
        fields:
          - { name: rol, label: Rol, type: string }
          - { name: nombre, label: Nombre, type: string }

  - name: registro
    label: Registro de taller
    type: collection
    path: _registro
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: texto
      fields: [fecha, tipo, proyecto, texto]
    fields:
      - name: texto
        label: Qué pasó (una línea)
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: date
        required: true
      - name: tipo
        label: Tipo
        type: select
        options:
          values: [proceso, prueba, muestra, convocatoria, lectura, otro]
      - name: proyecto
        label: Proyecto (nombre del archivo, ej. silencios-de-segundos)
        type: string
        required: true

  - name: cv
    label: CV
    type: file
    path: _data/cv.yml
    format: yaml
    fields:
      - name: grupos
        label: Grupos
        type: object
        list:
          collapsible: true
        fields:
          - name: nombre
            label: Grupo
            type: select
            options:
              values: [Exhibiciones, Convocatorias y premios, Residencias, Formación artística, Formación académica, Prensa]
          - name: entradas
            label: Entradas
            type: object
            list:
              collapsible: true
            fields:
              - { name: anio, label: Año, type: string, description: "Ej.: 2024 o 2023–2024" }
              - { name: titulo, label: Título, type: string }
              - { name: lugar, label: Lugar, type: string }
              - { name: proyecto, label: "Proyecto vinculado (opcional, ej. estacionn3)", type: string }

  - name: artista
    label: Artista (datos para Google e IA)
    type: file
    path: _data/artista.yml
    format: yaml
    fields:
      - { name: nombre, label: Nombre, type: string }
      - { name: alias, label: Alias, type: string }
      - { name: oficio, label: Oficio, type: string }
      - { name: linea, label: Línea de presentación, type: string }
      - { name: bio, label: "Bio (tercera persona, ~100 palabras)", type: text }
      - { name: statement, label: "Statement (primera persona; párrafos separados por una línea en blanco)", type: text }
      - { name: nacimiento_lugar, label: Lugar de nacimiento, type: string }
      - { name: nacimiento_anio, label: Año de nacimiento, type: string }
      - { name: ciudad, label: Ciudad, type: string }
      - { name: pais, label: País, type: string }
      - { name: temas, label: Temas y disciplinas, type: string, list: true }
      - name: redes
        label: Redes
        type: object
        list: true
        fields:
          - { name: nombre, label: Red, type: string }
          - { name: url, label: Link, type: string }

  - name: home
    label: Home
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - name: seo
        label: Google (título y descripción de la home)
        type: object
        fields:
          - { name: titulo, label: Título de la pestaña y de Google, type: string }
          - { name: descripcion, label: Descripción para Google, type: text }
      - name: hero
        label: Portada
        type: object
        fields:
          - { name: titular_1, label: "Titular, línea 1 (*cursiva* con asteriscos)", type: string }
          - { name: titular_2, label: "Titular, línea 2", type: string }
          - { name: rol, label: Rol, type: string }
          - { name: descripcion, label: Descripción, type: text }
          - { name: boton, label: Texto del botón, type: string }
      - name: que_hago
        label: Qué hago
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta de sección, type: string }
          - { name: items, label: "Frases (*cursiva* con asteriscos)", type: string, list: true }
          - name: imagen
            label: Imagen
            type: image
            description: "Subila tal cual; se convierte a webp sola. Si la dejás vacía, vuelve la original."
          - { name: imagen_alt, label: "Descripción de la imagen (accesibilidad y Google)", type: string }
      - name: sobre_mi
        label: Sobre mí
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta de sección, type: string }
          - { name: columna_1, label: Párrafos columna izquierda, type: text, list: true }
          - { name: columna_2, label: Párrafos columna derecha, type: text, list: true }
          - { name: detalle, label: Línea final, type: string }
      - name: obra
        label: Obra
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta de sección, type: string }
      - name: contacto
        label: Contacto
        type: object
        fields:
          - { name: antetitulo, label: Antetítulo, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
