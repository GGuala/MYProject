{%- comment -%}
  Ficha de la obra para Google y las IA (schema.org VisualArtwork).
  Los proyectos protegidos no publican imagen acá.
{%- endcomment -%}
{%- assign anio_inicio = obra.anios | slice: 0, 4 -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VisualArtwork",
  "@id": "{{ site.url }}{{ obra.url }}#obra",
  "name": {{ titulo | jsonify }},
  "url": "{{ site.url }}{{ ruta }}",
  "inLanguage": "{{ lang }}",
  "creator": { "@type": "Person", "@id": "{{ site.url }}/#artista", "name": {{ site.data.artista.nombre | jsonify }} }
  {%- if anio_inicio != "" %},
  "dateCreated": {{ anio_inicio | jsonify }}
  {%- endif %}
  {%- if medios and medios.size > 0 %},
  "artform": {{ medios | join: ", " | jsonify }}
  {%- endif %}
  {%- if obra.ficha.tecnica %},
  {%- capture _tec -%}{% include t.html o=obra.ficha c="tecnica" %}{%- endcapture %}
  "artMedium": {{ _tec | jsonify }}
  {%- endif %}
  {%- if descripcion != "" %},
  "description": {{ descripcion_raw | strip_newlines | jsonify }}
  {%- endif %}
  {%- if obra.hilos and obra.hilos.size > 0 %},
  {%- capture _kw -%}{% for h in obra.hilos %}{{ L.hilos[h] | default: h }}{% unless forloop.last %}, {% endunless %}{% endfor %}{%- endcapture %}
  "keywords": {{ _kw | jsonify }}
  {%- endif %}
  {%- if portada and protegido == false %},
  "image": "{{ site.url }}{{ portada }}"
  {%- endif %}
  {%- if obra.exhibiciones and obra.exhibiciones.size > 0 %},
  "subjectOf": [
    {%- for x in obra.exhibiciones %}
    {
      "@type": "ExhibitionEvent",
      "name": {{ x.titulo | jsonify }}
      {%- if x.anio %}, "startDate": {{ x.anio | jsonify }}{% endif %}
      {%- if x.lugar %}, "location": { "@type": "Place", "name": {{ x.lugar | jsonify }} }{% endif %}
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
  {%- endif %}
}
</script>
